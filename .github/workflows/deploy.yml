name: Deploy to GitHub Pages

# Publishes on every push to main, and on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The permissions Pages needs to accept a deployment from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` rather than `install`: builds from the lockfile exactly, so the
      # deployed site is the one that was tested locally.
      - run: npm ci

      # Runs next build and then tools/postexport.mjs, which flattens the
      # navigation payloads Next writes as folders.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
